<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/images/favicon.png" sizes="16x16 32x32" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Python Full Course for Beginners</title>
  </head>
  <body class="dark-mode">
    <header class="nav-bar flex-set dark-mode">
      <nav class="nav-left flex-set">
        <button class="menu-toggle flex-set" id="MenuToggle">
          <i class="bi bi-list menu-icon flex-set"></i>
        </button>

        <button class="youtube-logo">
          <a href="index.html">
            <img
              src="images/YTLogo.png"
              alt="YouTube Logo"
              title="YouTube Home"
            />
          </a>
        </button>
      </nav>

      <nav class="search-bar flex-set">
        <div class="search-input flex-set">
          <input type="text" placeholder="Search" />
          <button class="search-btn">
            <i class="bi bi-search" title="Search"></i>
          </button>
        </div>

        <button class="mic-btn" title="Search with your voice">
          <i class="bi bi-mic-fill"></i>
        </button>
      </nav>

      <nav class="nav-right flex-set">
        <button class="create-btn right-btns flex-set font-bold">
          <i class="bi bi-plus-lg flex-set"></i>
          <p class="create-text">Create</p>
        </button>

        <button class="notif-btn right-btns">
          <i class="bi bi-bell" title="Notifications"></i>
        </button>

        <button class="profile-btn-nav right-btns">
          <i class="bi bi-person-circle" title="Profile"></i>
        </button>
      </nav>
    </header>

    <main class="video-page">
      <iframe
        src="https://www.youtube.com/embed/_uQrJ0TkZlc"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        class="embed-video"
      ></iframe>
    </main>
  </body>
</html>
